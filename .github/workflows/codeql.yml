name: "CodeQL Advanced"

on:
  workflow_dispatch:
  schedule:
    - cron: '39 18 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # ubuntu-latest rolled to 26.04 (resolute), for which apt.llvm.org has no
    # llvm-toolchain-<codename>-20 suite yet; the clang-20 install step 404s.
    # Pin to 24.04 (noble), like every other workflow in this repo.
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        - language: c-cpp
          build-mode: manual
        - language: java-kotlin
          build-mode: manual
        - language: actions
          build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 21
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Install clang-20
      if: matrix.language == 'c-cpp'
      shell: bash
      run: |
        # Committed rather than downloaded; see bin/apt-install.sh.
        sudo install -D -m 0644 bin/llvm-snapshot.gpg.key /etc/apt/keyrings/llvm.asc
        UBUNTU_CODENAME=$(lsb_release -cs)
        echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/${UBUNTU_CODENAME}/ llvm-toolchain-${UBUNTU_CODENAME}-20 main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
        sudo apt-get update -q
        sudo apt-get install -q -y --no-install-recommends clang-20 lld-20
        # Runtime Makefile invokes bare `clang` / `clang++`
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100

    - name: Init libbacktrace submodule
      if: matrix.language == 'c-cpp'
      run: git submodule update --init skiplang/prelude/libbacktrace

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # query suite and filters live in .github/codeql/codeql-config.yml
        config-file: .github/codeql/codeql-config.yml

    - name: Build C runtime (manual c-cpp)
      if: matrix.language == 'c-cpp'
      shell: bash
      working-directory: skiplang/prelude/runtime
      # A command-line CFLAGS overrides the Makefile's own `CFLAGS += -I. ...`,
      # so -I. must be repeated here or ryu/*.c can't resolve #include "ryu/...".
      run: make CFLAGS="-O2 -g3 -I. -I../libbacktrace" libskip_runtime64.a

    - name: Build Kotlin sources (manual java-kotlin)
      if: matrix.language == 'java-kotlin'
      shell: bash
      working-directory: sql/server
      run: ./gradlew --no-daemon classes testClasses

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
