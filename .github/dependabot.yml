# Security updates only.
#
# "Dependabot security updates" is enabled in the repo settings
# (security_and_analysis.dependabot_security_updates = enabled) and opens PRs
# for fixable vulnerabilities in every manifest, independent of this file.
# Vulnerability alerts are always shown in the Security tab.
#
# Version updates are intentionally disabled: with an empty `updates` list,
# Dependabot opens no routine "bump to latest" PRs. Fixes that need a range
# change or an override (e.g. a transitive major like minimatch 10 -> 11) are
# not auto-PR-able; handle those manually as in #1647.
